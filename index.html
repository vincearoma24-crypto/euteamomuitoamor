<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Book</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background-color: #add8e6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .sticker {
      position: absolute;
      width: 950px;
      height: auto;
      opacity: 0.85;
      z-index: 0;
      animation: rotate 12s linear infinite, pulse 4s ease-in-out infinite;
    }
    .sticker.top-left { top: 15px; left: 15px; }
    .sticker.top-right { top: 15px; right: 15px; }
    .sticker.bottom-left { bottom: 15px; left: 15px; }
    .sticker.bottom-right { bottom: 15px; right: 15px; }
    .sticker.center-top { top: 10%; left: 50%; transform: translateX(-50%); }
    .sticker.center-bottom { bottom: 10%; left: 50%; transform: translateX(-50%); }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

    .book {
      width: 100%;
      max-width: 500px;
      height: 300px;
      perspective: 1500px;
      position: relative;
      z-index: 1;
      display: flex;
    }
    .page {
      width: 50%;
      height: 150%;
      background: rgba(255,255,255,0.95);
      box-sizing: border-box;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.2);
      padding: 20px;
      overflow-y: auto;
      border-radius: 5px;
      font-size: 14px;
    }
    .left-page { border-right: 2px solid #999; transform-origin: right center; transition: transform 0.8s ease-in-out; backface-visibility: hidden; }
    .right-page { border-left: 2px solid #999; transform-origin: left center; transition: transform 0.8s ease-in-out; backface-visibility: hidden; }
    .controls { margin-top: 10px; text-align: center; z-index: 2; }
    button { background: #1e3f66; color: #fff; border: none; padding: 8px 16px; margin: 0 5px; cursor: pointer; font-size: 14px; border-radius: 5px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    button:hover { background: #16324f; transform: scale(1.08); box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
    .page-indicator { display: inline-block; margin: 0 8px; font-size: 14px; color: #1e3f66; font-weight: bold; }
    .flip-left { transform: rotateY(-180deg); }
    .flip-right { transform: rotateY(180deg); }
  </style>
</head>
<body>
  <!-- Stickers scattered -->
  <img src="flower3.png" class="sticker top-left">
  <img src="flower2.png" class="sticker top-right">
  <img src="flower1.png" class="sticker bottom-left">
  <img src="flower4.png" class="sticker bottom-right">
  <img src="flower5.png" class="sticker center-top">
  <img src="flower6.png" class="sticker center-bottom">

  <!-- Book -->
  <div class="book">
    <div class="page left-page" id="leftPage"></div>
    <div class="page right-page" id="rightPage"></div>
  </div>
  <div class="controls">
    <button onclick="prevPage()">◀ Prev</button>
    <span class="page-indicator" id="pageIndicator"></span>
    <button onclick="nextPage()">Next ▶</button>
  </div>

  <script>
  const pages = [
    "Page 1 — <br><br>Today I wrote not just a letter, but a set of words that carry my heart. Each page is a reflection of how deeply I cherish you. On your birthday, I want you to feel surrounded by love, not only in the celebration but in every thought I place here. You are my muse, my joy, my safe place. This letter is my gift — eighteen pages of affection, each one a reminder that you are my everything.",
    
    "Page 2 — <br><br>Feliz aniversário, meu neném. Eighteen is a beautiful age, a doorway to new adventures and dreams. I am so proud of the person you are becoming. You shine with kindness, courage, beauty and grace. Today is not just about candles or gifts, but about celebrating your existence — the light you bring into my life and the world. May this birthday remind you of how extraordinary you are, and how deeply you are loved.",
    
    "Page 3 — <br><br>Turning eighteen is more than a milestone, it is a promise of new beginnings. You stand at the edge of adulthood, ready to embrace challenges and opportunities. Yet to me, you will always be that girl who captured my heart. I see in you a rare blend of love and strength, a soul that inspires me daily. This birthday marks not just your growth, but the growth of our love, stronger with each passing year.",
    
    "Page 4 — <br><br>I remember the first time we met. The world seemed to be brighter, as if a light just touched my soul. My heart raced, my thoughts stilled, and I knew you were someone I could never forget. From that moment, every conversation, every laugh, every jokes became a treasure. Meeting you was not chance — it was destiny. And today, I celebrate that destiny with gratitude and love.",
    
    "Page 5 — <br><br>Our early days together are etched in my heart. The laughter we shared, the nervous excitement of our first calls, the way my soul felt at peace when we were having our time. Those moments may seem small, but they were the foundation of something immense. They remind me that love is built not only on grand gestures, but on simple joys, quiet moments, and the comfort of knowing we belong together.",
    
    "Page 6 — <br><br>Since those first days, we have grown together. We’ve faced challenges, celebrated achievements, and built memories that will last forever. Each step has strengthened our bond, each moment has deepened my love. You have taught me patience, trust, and resilience. With you, I have learned that love is not about perfection, but about choosing each other, day after day.",
    
    "Page 7 — <br><br>There are countless things I admire about you. Your kindness, which touches everyone around you. Your intelligence, sharp and graceful. Your beauty, not only in your smile but in the way your soul shines through. You inspire me to be better, to strive harder, to love deeper. You remind me that life is not about perfection, but about authenticity.",
    
    "Page 8 — <br><br>I appreciate the little things you do — the way you listen, the way you laugh, the way you care. I appreciate your strength, your courage, your determination. I appreciate the way you make me feel seen, valued, and loved. You are my partner, my bestfriend, and my muse. And I am endlessly grateful for you.",
    
    "Page 9 — <br><br>You carry within you a light that cannot be dimmed. It shines in your smile, in your words, in your actions. It comforts, inspires, and uplifts. You are a beacon in my life, guiding me through darkness, reminding me of hope. Your light is a gift, not just to me, but to the world.",
    
    "Page 10 — <br><br>If I could paint you in words, I would say you are the sunrise that breaks the night, the ocean that holds infinite mysteries, the song that lingers long after the music fades. You are the star I wish upon, the poetry that flows without effort, the gentle breeze that carries peace to my restless heart.",
    
    "Page 11 — <br><br>You are my anchor in storms, my wings in flight, my compass when I am lost. You are the warmth in winter, the coolness in summer, the calm in chaos. Loving you is like breathing — natural, essential, endless.",
    
    "Page 12 — <br><br>I dream of traveling the world with you, walking hand in hand through distant streets, watching sunsets on shores. I dream of building a home together, filled with laughter and love. I dream of supporting each other’s ambitions, cheering for accomplishments, comforting in doubts.",
    
    "Page 13 — <br><br>I see us growing together, not just in age, but in wisdom, patience, and love. I see us building a life that is not just about surviving, but thriving — a life where we chase dreams, nurture passions, and create memories that last forever.",
    
    "Page 14 — <br><br>Our vision is simple: to love, to grow, to build. To create a life where kindness, joy, and hope are at the center. To walk together through every challenge, to celebrate every triumph, to cherish every moment.",
    
    "Page 15 — <br><br>Love is not always easy. It requires patience, trust, forgiveness, resilience. But with you, love feels natural. It feels like breathing. It feels like coming home. Our relationship has taught me that love is not about perfection, but persistence. And I promise to always choose you.",
    
    "Page 16 — <br><br>With you, I have learned that love is about giving, not taking. About listening, not just speaking. About holding on, even when it’s hard. You have taught me that true love is gentle, patient, and kind.",
    
    "Page 17 — <br><br>On this birthday, I wish you joy that never fades, courage that never falters, dreams that never die. I wish you success in every path, peace in every storm, love in every corner of your life. May this year be filled with blessings, opportunities, and unforgettable moments.",
    
    "Page 18 — <br><br>So here we are, at the last page of this letter, but never at the end of my love. Eighteen pages, thousands of words, yet still not enough to capture the depth of what I feel. You are my everything. My bestfriend, my partner, my love, my future. Feliz aniversário, Meu amor. Forever yours- Vincent."
  ];

  let currentPage = 0;
  const leftPage = document.getElementById('leftPage');
  const rightPage = document.getElementById('rightPage');
  const pageIndicator = document.getElementById('pageIndicator');

  function renderPages() {
    leftPage.innerHTML = pages[currentPage] || "";
    rightPage.innerHTML = pages[currentPage + 1] || "";
    updateIndicator();
  }

  function updateIndicator() {
    pageIndicator.textContent = `Pages ${currentPage + 1}-${Math.min(currentPage + 2, pages.length)} of ${pages.length}`;
  }

  function nextPage() {
    if (currentPage < pages.length - 2) {
      rightPage.classList.add('flip-left');
      setTimeout(() => {
        currentPage += 2;
        rightPage.classList.remove('flip-left');
        renderPages();
      }, 800);
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      leftPage.classList.add('flip-right');
      setTimeout(() => {
        currentPage -= 2;
        leftPage.classList.remove('flip-right');
        renderPages();
      }, 800);
    }
  }

  renderPages();
</script>
